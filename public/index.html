<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PROVINCIAL KAYO CONFERENCE 2026</title>

    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

    <div class="container">

        <div class="card">

            <div class="header">
                <h1>PROVINCIAL KAYO CONFERENCE 2026</h1>
                <h2>Empowered to Lead,Serve&Transform</h2>
                <h3>Date 17th - 21st August 2026</h3>
                <p>Please complete the registration form below</p>
            </div>

            <form id="registrationForm">

                <div class="form-group">
                    <label for="full_name">Full Name</label>

                    <input
                        type="text"
                        id="full_name"
                        name="full_name"
                        placeholder="Enter your full name"
                        required
                    >
                </div>

                                <div class="form-group">
                    <label for="gender">Gender</label>

                    <select
                        id="gender"
                        name="gender"
                        required
                    >
                        <option value="">
                            Select gender
                        </option>

                        <option value="MALE">
                            Male
                        </option>

                        <option value="FEMALE">
                            Female
                        </option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="diocese">Diocese</label>

                    <select
                        id="diocese"
                        name="diocese"
                        required
                    >
                        <option value="">
                            Loading dioceses...
                        </option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="payment_method">
                        Mode of Payment
                    </label>

                    <select
                        id="payment_method"
                        name="payment_method"
                        required
                    >
                        <option value="">
                            Select payment method
                        </option>

                        <option value="MPESA">
                            M-Pesa
                        </option>

                        <option value="CASH">
                            Cash
                        </option>

                        <option value="CHEQUE">
                            Cheque 
                        </option>
                        <option value="BANK_TRANSFER">
                            Bank 
                        </option>
                    </select>
                </div>

                <div class="form-group payment-details" id="cash-details" style="display: none;">
    <label for="cash_amount">Amount Paid (Ksh)</label>

    <input
        type="number"
        id="cash_amount"
        name="cash_amount"
        min="0"
        step="1"
        placeholder="Enter amount paid"
    >
</div>

<!-- MPESA -->
<div class="form-group payment-details" id="mpesa-details" style="display: none;">
    <label for="mpesa_code">M-Pesa Transaction Code</label>

    <input
        type="text"
        id="mpesa_code"
        name="mpesa_code"
        maxlength="20"
        placeholder="e.g. QGH7K8XXXX"
    >
</div>

<!-- CHEQUE -->
<div class="form-group payment-details" id="cheque-details" style="display: none;">
    <label for="cheque_number">Cheque Number / Reference</label>

    <input
        type="text"
        id="cheque_number"
        name="cheque_number"
        maxlength="50"
        placeholder="Enter cheque number"
    >
</div>

<!-- BANK -->
<div class="form-group payment-details" id="bank-details" style="display: none;">
    <label for="bank_reference">Bank Transaction / Deposit Reference</label>

    <input
        type="text"
        id="bank_reference"
        name="bank_reference"
        maxlength="100"
        placeholder="Enter bank reference"
    >
</div>

                <button
                    type="submit"
                    id="submitButton"
                >
                    REGISTER
                </button>

            </form>

            <div
                id="message"
                class="message"
            ></div>

        </div>

    </div>

    <script src="/js/registration.js"></script>

</body>
</html>
